<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin com Animate.css</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --animate-duration: 8s;
            --animate-delay: 0s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            margin: 0;
        }

        .quadrant {
            width: 400px;
            height: 400px;
            border: 2px dashed #ecf0f1;
            position: relative;
        }

        #goblin {
            width: 80px;
            height: 80px;
            position: absolute;
        }

        .sprite {
            width: 100%;
            height: 100%;
            background-image: url('goblin_big.png');
            background-size: 240px 320px;
            animation:
                walk-cycle 0.9s steps(3) infinite,
                change-direction 8s steps(1) infinite;
        }

        .animate__bounce {
            --animate-duration: 8s;
            animation-iteration-count: infinite;
        }

        .animate__pulse {
            --animate-duration: 0.9s;
        }

        @keyframes walk-cycle {
           100% { background-position-x: -240px; }
        }
        
        @keyframes change-direction {
            0%    { background-position-y: 0px; }
            25%   { background-position-y: -160px; }
            50%   { background-position-y: -80px; }
            75%   { background-position-y: -240px; }
            100%  { background-position-y: 0px; }
        }

        @keyframes move-around {
            0%    { top: 0;   left: 0; }
            25%   { top: 320px; left: 0; }
            50%   { top: 320px; left: 320px; }
            75%   { top: 0;   left: 320px; }
            100%  { top: 0;   left: 0; }
        }

        .goblin-movement {
            animation: move-around 8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="quadrant">
        <div id="goblin" class="animate__animated animate__bounce goblin-movement">
            <div class="sprite animate__animated animate__pulse animate__infinite"></div>
        </div>
    </div>
</body>
</html>
