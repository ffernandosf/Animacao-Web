<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader com Animate.css</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --animate-duration: 1s;
            --animate-delay: 0.5s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: sans-serif;
        }

        .loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 5px solid #E0E0E0;
            border-top-color: #3498db;
        }

        .animate__rotateIn {
            --animate-duration: 2s;
        }

        .animate__infinite.animate__rotateIn {
            animation-name: rotateIn;
            animation-duration: 1s;
            animation-timing-function: linear;
        }
    </style>
</head>
<body>
    <div class="loader animate__animated animate__rotateIn animate__infinite"></div>
</body>
</html>
