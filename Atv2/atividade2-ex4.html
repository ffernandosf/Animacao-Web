<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Bar com Borda</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: sans-serif;
        }

        .load-bar-container {
            width: 300px;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            
            /* --- LINHAS ADICIONADAS --- */
            border: 2px solid black; 
            box-sizing: border-box; /* Garante que a borda não aumente o tamanho total */
        }

        .load-bar {
            width: 0%;
            height: 100%;
            background-color: red;
            border-radius: 2px; /* Pequeno ajuste para a barra interna não sobrepor a borda do container */
            animation: fillBar 2s linear forwards paused; 
        }

        .load-bar-container:hover .load-bar {
            animation-play-state: running;
        }

        @keyframes fillBar {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="load-bar-container">
        <div class="load-bar"></div>
    </div>
</body>
</html>
